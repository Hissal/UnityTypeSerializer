name: Release Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      create_tag:
        description: 'Create and push tag if it does not exist'
        required: true
        type: boolean
        default: true
      force_republish:
        description: 'Force republish even if tag exists on different commit'
        required: true
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Validate tag and commit (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          CREATE_TAG="${{ github.event.inputs.create_tag }}"
          FORCE_REPUBLISH="${{ github.event.inputs.force_republish }}"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          
          echo "Current commit: $CURRENT_COMMIT"
          
          # Check if tag exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "v$VERSION^{commit}")
            echo "Tag v$VERSION exists and points to commit: $TAG_COMMIT"
            
            if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
              echo "✓ Tag v$VERSION points to current commit - proceeding with republish"
            else
              echo "⚠ Tag v$VERSION exists but points to a different commit"
              echo "  Tag commit:     $TAG_COMMIT"
              echo "  Current commit: $CURRENT_COMMIT"
              
              if [ "$FORCE_REPUBLISH" = "true" ]; then
                echo "✓ Force republish enabled - proceeding anyway"
              else
                echo "✗ Error: Tag exists on different commit and force_republish is not enabled"
                echo "  Please enable 'force_republish' option or use a different version number"
                exit 1
              fi
            fi
          else
            echo "Tag v$VERSION does not exist"
            
            if [ "$CREATE_TAG" = "true" ]; then
              echo "Creating and pushing tag v$VERSION"
              git tag "v$VERSION"
              git push origin "v$VERSION"
              echo "✓ Created and pushed tag v$VERSION"
            else
              echo "✗ Error: Tag does not exist and create_tag is disabled"
              exit 1
            fi
          fi

      - name: Split and push to public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Debug: Show raw inputs
          echo "=== URL Debugging ==="
          echo "Raw PUBLIC_REPO_URL: ${PUBLIC_REPO_URL}"
          echo "Raw PUBLIC_REPO_TOKEN length: ${#PUBLIC_REPO_TOKEN}"
          
          # Normalize URL - remove .git suffix if present, Git will add it back
          NORMALIZED_URL="${PUBLIC_REPO_URL%.git}"
          echo "Normalized URL (after removing .git): ${NORMALIZED_URL}"
          
          # Validate URL format
          if [[ ! "$NORMALIZED_URL" =~ ^github\.com/.+/.+ ]]; then
            echo "✗ Error: PUBLIC_REPO_URL format is invalid"
            echo "  Expected: github.com/OWNER/REPO"
            echo "  Got: ${NORMALIZED_URL}"
            exit 1
          fi
          echo "✓ URL format is valid"
          
          # Extract owner/repo for API verification
          REPO_PATH=$(echo "${NORMALIZED_URL}" | sed 's/github.com\///')
          echo "Repository path: ${REPO_PATH}"
          
          # Verify token has access to the repository
          echo ""
          echo "=== Token Verification ==="
          echo "Token present: $([ -n "${PUBLIC_REPO_TOKEN}" ] && echo 'yes' || echo 'no')"
          echo "Token length: ${#PUBLIC_REPO_TOKEN}"
          
          if curl -f -H "Authorization: token ${PUBLIC_REPO_TOKEN}" "https://api.github.com/repos/${REPO_PATH}" > /dev/null 2>&1; then
            echo "✓ Token has access to the repository via API"
          else
            echo "✗ Token cannot access the repository - check token permissions"
            echo "  Attempted to access: ${REPO_PATH}"
            exit 1
          fi
          
          # Construct the authenticated URL
          AUTH_URL="https://x-access-token:${PUBLIC_REPO_TOKEN}@${NORMALIZED_URL}"
          echo ""
          echo "=== Push URL Construction ==="
          echo "Will push to: https://x-access-token:***@${NORMALIZED_URL}"
          
          # Aggressively disable all credential helpers
          echo ""
          echo "=== Git Configuration ==="
          
          # Clear all git configs that might interfere
          git config --global --unset-all credential.helper || true
          git config --system --unset-all credential.helper || true
          git config --local --unset-all credential.helper || true
          echo "Cleared all credential helpers"
          
          # Remove any extraheader configs (set by actions/checkout)
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "Removed GitHub Actions authentication headers"
          
          # Show current git config
          echo "Current git credential config:"
          git config --list | grep -i credential || echo "  (none)"
          git config --list | grep -i extraheader || echo "  (none)"
          
          # Set git identity for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Set git identity"
          
          echo "Creating subtree split for package directory..."
          # Create a temporary branch with only the package directory
          git subtree split --prefix=Assets/Packages/Hissal/UnityTypeSerializer -b pkg-split
          
          echo "Checking out split branch..."
          # Checkout the split branch
          git checkout pkg-split
          
          echo "Updating package.json version to $VERSION..."
          # Update package.json version in the split branch
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          
          echo "Committing version update..."
          # Commit the version update
          git add package.json
          git commit -m "chore: release version $VERSION"
          
          echo ""
          echo "=== Pushing to Public Repository ==="
          echo "Pushing to: https://x-access-token:***@${NORMALIZED_URL}"
          
          # Push using the authenticated URL - should work now that we've cleared interfering auth
          if git push "${AUTH_URL}" HEAD:main --force --verbose 2>&1; then
            echo "✓ Push successful!"
          else
            PUSH_EXIT_CODE=$?
            echo ""
            echo "✗ Push failed with exit code: $PUSH_EXIT_CODE"
            echo ""
            echo "=== Troubleshooting Information ==="
            echo "Token length: ${#PUBLIC_REPO_TOKEN}"
            echo "Repository: ${REPO_PATH}"
            echo "Push URL format: https://x-access-token:TOKEN@${NORMALIZED_URL}"
            echo ""
            echo "The token verified successfully via API, but git push failed."
            echo "Possible causes:"
            echo "1. Fine-grained token without 'Contents: Write' permission"
            echo "2. Branch protection rules on the main branch"
            echo "3. Repository settings preventing force pushes"
            echo ""
            echo "Please check your token permissions at:"
            echo "https://github.com/settings/tokens"
            exit 1
          fi
          
          # Also push the tag to the public repository for the release
          echo ""
          echo "Pushing tag v${VERSION} to public repository..."
          if git push "${AUTH_URL}" "v${VERSION}" --force 2>&1; then
            echo "✓ Tag pushed successfully!"
          else
            echo "⚠ Warning: Failed to push tag, but code was pushed successfully"
            echo "  You may need to create the release manually"
          fi
          
          echo "Cleaning up..."
          # Switch back to original branch and clean up
          git checkout -
          git branch -D pkg-split
          
          echo "✓ Successfully pushed package version $VERSION to public repository"

      - name: Create GitHub Release in Public Repository
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true')
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NORMALIZED_URL="${PUBLIC_REPO_URL%.git}"
          REPO_PATH=$(echo "${NORMALIZED_URL}" | sed 's/github.com\///')
          
          echo "Creating release v${VERSION} in public repository: ${REPO_PATH}"
          
          # Create release using GitHub API
          RESPONSE=$(curl -X POST \
            -H "Authorization: token ${PUBLIC_REPO_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO_PATH}/releases" \
            -d @- << EOF
          {
            "tag_name": "v${VERSION}",
            "name": "Release v${VERSION}",
            "body": "Release version ${VERSION}\n\n## Installation\n\nAdd this package to your Unity project via Package Manager:\n\`\`\`\nhttps://${NORMALIZED_URL}\n\`\`\`\n\n## What's Changed\n\nSee the [CHANGELOG](https://github.com/${REPO_PATH}/blob/main/CHANGELOG.md) for details.",
            "draft": false,
            "prerelease": false
          }
          EOF
          )
          
          # Check if release was created successfully
          if echo "$RESPONSE" | grep -q '"id"'; then
            RELEASE_URL=$(echo "$RESPONSE" | grep '"html_url"' | head -1 | cut -d'"' -f4)
            echo "✓ Release created successfully: ${RELEASE_URL}"
          else
            echo "⚠ Warning: Failed to create release"
            echo "Response: $RESPONSE"
            echo ""
            echo "This might be because:"
            echo "1. A release with this tag already exists"
            echo "2. The tag doesn't exist in the public repository yet"
            echo "3. The token doesn't have permission to create releases"
            echo ""
            echo "The package was pushed successfully, so you can create the release manually if needed."
          fi
