name: Release Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      create_tag:
        description: 'Create and push tag if it does not exist'
        required: true
        type: boolean
        default: true
      force_republish:
        description: 'Force republish even if tag exists on different commit'
        required: true
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Validate tag and commit (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          CREATE_TAG="${{ github.event.inputs.create_tag }}"
          FORCE_REPUBLISH="${{ github.event.inputs.force_republish }}"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          
          echo "Current commit: $CURRENT_COMMIT"
          
          # Check if tag exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "v$VERSION^{commit}")
            echo "Tag v$VERSION exists and points to commit: $TAG_COMMIT"
            
            if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
              echo "✓ Tag v$VERSION points to current commit - proceeding with republish"
            else
              echo "⚠ Tag v$VERSION exists but points to a different commit"
              echo "  Tag commit:     $TAG_COMMIT"
              echo "  Current commit: $CURRENT_COMMIT"
              
              if [ "$FORCE_REPUBLISH" = "true" ]; then
                echo "✓ Force republish enabled - proceeding anyway"
              else
                echo "✗ Error: Tag exists on different commit and force_republish is not enabled"
                echo "  Please enable 'force_republish' option or use a different version number"
                exit 1
              fi
            fi
          else
            echo "Tag v$VERSION does not exist"
            
            if [ "$CREATE_TAG" = "true" ]; then
              echo "Creating and pushing tag v$VERSION"
              git tag "v$VERSION"
              git push origin "v$VERSION"
              echo "✓ Created and pushed tag v$VERSION"
            else
              echo "✗ Error: Tag does not exist and create_tag is disabled"
              exit 1
            fi
          fi

      - name: Configure Git for public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split and push to public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Normalize URL - remove .git suffix if present, Git will add it back
          NORMALIZED_URL="${PUBLIC_REPO_URL%.git}"
          
          # Debug output (token will be masked by GitHub)
          echo "Repo URL (normalized): ${NORMALIZED_URL}"
          echo "Token present: $([ -n "${PUBLIC_REPO_TOKEN}" ] && echo 'yes' || echo 'no')"
          echo "Token length: ${#PUBLIC_REPO_TOKEN}"
          
          echo "Creating subtree split for package directory..."
          # Create a temporary branch with only the package directory
          git subtree split --prefix=Assets/Packages/Hissal/UnityTypeSerializer -b pkg-split
          
          echo "Checking out split branch..."
          # Checkout the split branch
          git checkout pkg-split
          
          echo "Updating package.json version to $VERSION..."
          # Update package.json version in the split branch
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          
          echo "Committing version update..."
          # Commit the version update
          git add package.json
          git commit -m "chore: release version $VERSION"
          
          echo "Pushing to public repository..."
          # Push directly using the URL with token
          # Format: https://x-access-token:TOKEN@github.com/USER/REPO
          git push "https://x-access-token:${PUBLIC_REPO_TOKEN}@${NORMALIZED_URL}" HEAD:main --force --verbose
          
          echo "Cleaning up..."
          # Switch back to original branch and clean up
          git checkout -
          git branch -D pkg-split
          
          echo "✓ Successfully pushed package version $VERSION to public repository"

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            Release version ${{ steps.version.outputs.version }}
            
            ## Installation
            Add this package to your Unity project via Package Manager:
            ```
            https://github.com/YOUR_PUBLIC_REPO_URL.git
            ```
