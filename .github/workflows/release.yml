name: Release Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      create_tag:
        description: 'Create and push tag if it does not exist'
        required: true
        type: boolean
        default: true
      force_republish:
        description: 'Force republish even if tag exists on different commit'
        required: true
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Validate and update CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_PATH="Assets/Packages/Hissal/UnityTypeSerializer/CHANGELOG.md"
          
          echo "=== Validating CHANGELOG for version $VERSION ==="
          
          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "✗ Error: CHANGELOG.md not found at $CHANGELOG_PATH"
            exit 1
          fi
          
          # Read the first few lines to check for version headers
          HEAD_CONTENT=$(head -n 10 "$CHANGELOG_PATH")
          
          # Check Case 1: "## v ..." exists (pending release)
          if echo "$HEAD_CONTENT" | grep -q "^## v \.\.\.$"; then
            echo "✓ Case 1: Found pending release marker '## v ...'"
            echo "  Updating to '## v $VERSION'"
            
            # Replace "## v ..." with the actual version
            sed -i "s/^## v \.\.\.$/## v $VERSION/" "$CHANGELOG_PATH"
            
            echo "changelog_updated=true" >> $GITHUB_OUTPUT
            echo "✓ CHANGELOG updated with version $VERSION"
            
          # Check Case 2: Version already exists in changelog
          elif echo "$HEAD_CONTENT" | grep -q "^## v $VERSION$"; then
            echo "✓ Case 2: Version $VERSION already exists in CHANGELOG"
            echo "  No changelog update needed"
            
            echo "changelog_updated=false" >> $GITHUB_OUTPUT
            
          # Case 3: Neither pending release nor existing version found
          else
            echo "✗ Case 3: CHANGELOG validation failed"
            echo ""
            echo "Expected one of the following:"
            echo "  1. A pending release marker: '## v ...'"
            echo "  2. An existing version header: '## v $VERSION'"
            echo ""
            echo "Found instead:"
            echo "$HEAD_CONTENT"
            echo ""
            echo "Please update the CHANGELOG.md before releasing."
            exit 1
          fi
          
          # Don't commit yet - we'll combine this with the pending release addition
          # to create a single commit later
          echo "✓ CHANGELOG changes staged for later commit"
      
      - name: Validate tag and commit (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          CREATE_TAG="${{ github.event.inputs.create_tag }}"
          FORCE_REPUBLISH="${{ github.event.inputs.force_republish }}"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          
          echo "Current commit: $CURRENT_COMMIT"
          
          # Check if tag exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "v$VERSION^{commit}")
            echo "Tag v$VERSION exists and points to commit: $TAG_COMMIT"
            
            if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
              echo "✓ Tag v$VERSION points to current commit - proceeding with republish"
            else
              echo "⚠ Tag v$VERSION exists but points to a different commit"
              echo "  Tag commit:     $TAG_COMMIT"
              echo "  Current commit: $CURRENT_COMMIT"
              
              if [ "$FORCE_REPUBLISH" = "true" ]; then
                echo "✓ Force republish enabled - proceeding anyway"
              else
                echo "✗ Error: Tag exists on different commit and force_republish is not enabled"
                echo "  Please enable 'force_republish' option or use a different version number"
                exit 1
              fi
            fi
          else
            echo "Tag v$VERSION does not exist"
            
            if [ "$CREATE_TAG" = "true" ]; then
              echo "Creating and pushing tag v$VERSION"
              git tag "v$VERSION"
              git push origin "v$VERSION"
              echo "✓ Created and pushed tag v$VERSION"
            else
              echo "✗ Error: Tag does not exist and create_tag is disabled"
              exit 1
            fi
          fi

      - name: Split and push to public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Debug: Show raw inputs
          echo "=== URL Debugging ==="
          echo "Raw PUBLIC_REPO_URL: ${PUBLIC_REPO_URL}"
          echo "Raw PUBLIC_REPO_TOKEN length: ${#PUBLIC_REPO_TOKEN}"
          
          # Normalize URL - remove .git suffix if present, Git will add it back
          NORMALIZED_URL="${PUBLIC_REPO_URL%.git}"
          echo "Normalized URL (after removing .git): ${NORMALIZED_URL}"
          
          # Validate URL format
          if [[ ! "$NORMALIZED_URL" =~ ^github\.com/.+/.+ ]]; then
            echo "✗ Error: PUBLIC_REPO_URL format is invalid"
            echo "  Expected: github.com/OWNER/REPO"
            echo "  Got: ${NORMALIZED_URL}"
            exit 1
          fi
          echo "✓ URL format is valid"
          
          # Extract owner/repo for API verification
          REPO_PATH=$(echo "${NORMALIZED_URL}" | sed 's/github.com\///')
          echo "Repository path: ${REPO_PATH}"
          
          # Verify token has access to the repository
          echo ""
          echo "=== Token Verification ==="
          echo "Token present: $([ -n "${PUBLIC_REPO_TOKEN}" ] && echo 'yes' || echo 'no')"
          echo "Token length: ${#PUBLIC_REPO_TOKEN}"
          
          if curl -f -H "Authorization: token ${PUBLIC_REPO_TOKEN}" "https://api.github.com/repos/${REPO_PATH}" > /dev/null 2>&1; then
            echo "✓ Token has access to the repository via API"
          else
            echo "✗ Token cannot access the repository - check token permissions"
            echo "  Attempted to access: ${REPO_PATH}"
            exit 1
          fi
          
          # Construct the authenticated URL
          AUTH_URL="https://x-access-token:${PUBLIC_REPO_TOKEN}@${NORMALIZED_URL}"
          echo ""
          echo "=== Push URL Construction ==="
          echo "Will push to: https://x-access-token:***@${NORMALIZED_URL}"
          
          # Aggressively disable all credential helpers
          echo ""
          echo "=== Git Configuration ==="
          
          # Clear all git configs that might interfere
          git config --global --unset-all credential.helper || true
          git config --system --unset-all credential.helper || true
          git config --local --unset-all credential.helper || true
          echo "Cleared all credential helpers"
          
          # Remove any extraheader configs (set by actions/checkout)
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "Removed GitHub Actions authentication headers"
          
          # Show current git config
          echo "Current git credential config:"
          git config --list | grep -i credential || echo "  (none)"
          git config --list | grep -i extraheader || echo "  (none)"
          
          # Set git identity for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Set git identity"
          
          echo "Creating subtree split for package directory..."
          
          # First, we need to commit the CHANGELOG changes temporarily for the split
          # But we'll amend this later to include the pending release marker
          if [ "$(git status --porcelain Assets/Packages/Hissal/UnityTypeSerializer/CHANGELOG.md)" ]; then
            git add Assets/Packages/Hissal/UnityTypeSerializer/CHANGELOG.md
            git commit -m "temp: changelog update for split"
            TEMP_COMMIT_CREATED=true
          else
            TEMP_COMMIT_CREATED=false
          fi
          
          # Create a temporary branch with only the package directory
          # This will include the CHANGELOG with the correct version (no pending release)
          git subtree split --prefix=Assets/Packages/Hissal/UnityTypeSerializer -b pkg-split
          
          echo "Checking out split branch..."
          # Checkout the split branch
          git checkout pkg-split
          
          echo "Updating package.json version to $VERSION..."
          # Update package.json version in the split branch
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          
          # Commit both package.json and any CHANGELOG changes
          echo "Committing version update..."
          git add package.json
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
          fi
          git commit -m "chore: release version $VERSION"
          
          echo ""
          echo "=== Pushing to Public Repository ==="
          echo "Pushing to: https://x-access-token:***@${NORMALIZED_URL}"
          
          # Check if we need to preserve history (fetch existing main)
          echo "Fetching current main branch from public repository..."
          if git fetch "${AUTH_URL}" main:refs/remotes/public/main 2>/dev/null; then
            echo "✓ Fetched existing main branch"
            
            # Check if our commit is based on the public main
            MERGE_BASE=$(git merge-base HEAD refs/remotes/public/main 2>/dev/null || echo "none")
            PUBLIC_HEAD=$(git rev-parse refs/remotes/public/main 2>/dev/null || echo "none")
            
            if [ "$MERGE_BASE" != "$PUBLIC_HEAD" ]; then
              echo "⚠ Warning: Split branch history diverges from public repository"
              echo "  This can happen when the subtree split creates different commits"
              echo "  Attempting to rebase onto public main to preserve history..."
              
              # Try to rebase our changes onto the public main
              if git rebase refs/remotes/public/main 2>/dev/null; then
                echo "✓ Successfully rebased onto public main - history preserved"
                FORCE_FLAG=""
              else
                echo "⚠ Rebase failed - using force push (history will be rewritten)"
                git rebase --abort 2>/dev/null || true
                FORCE_FLAG="--force"
              fi
            else
              echo "✓ Split branch is up-to-date with public main"
              FORCE_FLAG=""
            fi
          else
            echo "ℹ Public repository is empty or unreachable - initial push"
            FORCE_FLAG=""
          fi
          
          # Push using the authenticated URL
          if git push "${AUTH_URL}" HEAD:main ${FORCE_FLAG} --verbose 2>&1; then
            echo "✓ Push successful!"
          else
            PUSH_EXIT_CODE=$?
            echo ""
            echo "✗ Push failed with exit code: $PUSH_EXIT_CODE"
            echo ""
            echo "=== Troubleshooting Information ==="
            echo "Token length: ${#PUBLIC_REPO_TOKEN}"
            echo "Repository: ${REPO_PATH}"
            echo "Push URL format: https://x-access-token:TOKEN@${NORMALIZED_URL}"
            echo ""
            echo "The token verified successfully via API, but git push failed."
            echo "Possible causes:"
            echo "1. Fine-grained token without 'Contents: Write' permission"
            echo "2. Branch protection rules on the main branch"
            echo "3. Repository settings preventing force pushes"
            echo ""
            echo "Please check your token permissions at:"
            echo "https://github.com/settings/tokens"
            exit 1
          fi
          
          # Also push the tag to the public repository for the release
          echo ""
          echo "Pushing tag v${VERSION} to public repository..."
          if git push "${AUTH_URL}" "v${VERSION}" 2>&1; then
            echo "✓ Tag pushed successfully!"
          else
            echo "⚠ Warning: Failed to push tag (it may already exist)"
            echo "  You may need to update or create the release manually"
          fi
          
          echo "Cleaning up..."
          # Switch back to original branch and clean up
          git checkout -
          git branch -D pkg-split
          
          # If we created a temp commit, reset it so we can create the combined commit later
          if [ "$TEMP_COMMIT_CREATED" = "true" ]; then
            echo "Resetting temp commit to prepare for combined commit..."
            git reset --soft HEAD~1
          fi
          
          echo "✓ Successfully pushed package version $VERSION to public repository"

      - name: Create GitHub Release in Public Repository
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true')
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NORMALIZED_URL="${PUBLIC_REPO_URL%.git}"
          REPO_PATH=$(echo "${NORMALIZED_URL}" | sed 's/github.com\///')
          
          echo "Creating release v${VERSION} in public repository: ${REPO_PATH}"
          
          # Create release using GitHub API
          RESPONSE=$(curl -X POST \
            -H "Authorization: token ${PUBLIC_REPO_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO_PATH}/releases" \
            -d @- << EOF
          {
            "tag_name": "v${VERSION}",
            "name": "Release v${VERSION}",
            "body": "Release version ${VERSION}\n\n## Installation\n\nAdd this package to your Unity project via Package Manager:\n\`\`\`\nhttps://${NORMALIZED_URL}\n\`\`\`\n\n## What's Changed\n\nSee the [CHANGELOG](https://github.com/${REPO_PATH}/blob/main/CHANGELOG.md) for details.",
            "draft": false,
            "prerelease": false
          }
          EOF
          )
          
          # Check if release was created successfully
          if echo "$RESPONSE" | grep -q '"id"'; then
            RELEASE_URL=$(echo "$RESPONSE" | grep '"html_url"' | head -1 | cut -d'"' -f4)
            echo "✓ Release created successfully: ${RELEASE_URL}"
          else
            echo "⚠ Warning: Failed to create release"
            echo "Response: $RESPONSE"
            echo ""
            echo "This might be because:"
            echo "1. A release with this tag already exists"
            echo "2. The tag doesn't exist in the public repository yet"
            echo "3. The token doesn't have permission to create releases"
            echo ""
            echo "The package was pushed successfully, so you can create the release manually if needed."
          fi

      - name: Create pending release in CHANGELOG and commit to main
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_PATH="Assets/Packages/Hissal/UnityTypeSerializer/CHANGELOG.md"
          
          echo "=== Creating combined CHANGELOG commit ==="
          
          # At this point, CHANGELOG might have "## v X.Y.Z" from the validation step
          # We need to add "## v ..." above it, then commit everything together
          
          # Check if "## v ..." already exists at the top
          if head -n 5 "$CHANGELOG_PATH" | grep -q "^## v \.\.\.$"; then
            echo "✓ Pending release marker already exists at the top"
            NEEDS_PENDING=false
          else
            echo "Adding new pending release marker to CHANGELOG"
            
            # Read the entire file and add pending release at the top
            CHANGELOG_CONTENT=$(<"$CHANGELOG_PATH")
            
            # Write the new content with pending release marker
            {
              echo "# Changelog"
              echo ""
              echo "## v ..."
              echo ""
              # Add the rest of the file, skipping the first "# Changelog" line
              echo "$CHANGELOG_CONTENT" | tail -n +2
            } > "${CHANGELOG_PATH}.tmp"
            
            mv "${CHANGELOG_PATH}.tmp" "$CHANGELOG_PATH"
            
            echo "✓ Added pending release marker '## v ...'"
            NEEDS_PENDING=true
          fi
          
          # Now commit both the version update and the pending release addition in one commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "$(git status --porcelain $CHANGELOG_PATH)" ]; then
            git add "$CHANGELOG_PATH"
            
            # Create a meaningful commit message
            if [ "${{ steps.changelog.outputs.changelog_updated }}" = "true" ] && [ "$NEEDS_PENDING" = "true" ]; then
              COMMIT_MSG="chore: release v$VERSION and prepare CHANGELOG for next release [skip ci]"
            elif [ "${{ steps.changelog.outputs.changelog_updated }}" = "true" ]; then
              COMMIT_MSG="chore: release v$VERSION [skip ci]"
            else
              COMMIT_MSG="chore: prepare CHANGELOG for next release [skip ci]"
            fi
            
            git commit -m "$COMMIT_MSG"
            
            echo "Attempting to push CHANGELOG update to main branch..."
            
            # Try direct push first (works if branch protection allows GitHub Actions)
            if git push origin HEAD:main 2>&1; then
              echo "✓ CHANGELOG updated and pushed directly to main branch"
            else
              echo "⚠ Direct push to main failed (likely due to branch protection)"
              echo "  Creating a temporary branch and attempting automated merge..."
              
              # Create a unique branch name with timestamp
              TEMP_BRANCH="chore/release-changelog-v${VERSION}-$(date +%s)"
              
              # Push to temporary branch
              git checkout -b "$TEMP_BRANCH"
              
              if git push origin "$TEMP_BRANCH" 2>&1; then
                echo "✓ Pushed changes to branch: $TEMP_BRANCH"
                echo ""
                echo "=== Action Required ==="
                echo "Branch protection prevented automatic update."
                echo "A branch has been created: $TEMP_BRANCH"
                echo ""
                echo "Options:"
                echo "1. Manually create a PR from $TEMP_BRANCH to main"
                echo "2. Manually merge the branch if you have admin permissions"
                echo "3. Update branch protection to allow GitHub Actions bot to push"
                echo ""
                echo "To allow GitHub Actions to push in the future, update branch protection rules:"
                echo "  Settings → Branches → main → Allow specified actors to bypass"
                echo "  Add: 'github-actions[bot]'"
              else
                echo "✗ Failed to push to temporary branch"
                echo "  The CHANGELOG changes are committed locally but not pushed"
                echo "  You may need to manually update the CHANGELOG in the repository"
              fi
              
              # Switch back to avoid leaving workflow in weird state
              git checkout -
            fi
          else
            echo "✓ No CHANGELOG changes needed"
          fi

